# Render Blueprint: full app (API + web) + managed PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use: push this repo to GitHub, then in Render: New -> Blueprint ->
# select the repo -> Apply. Render creates both resources automatically.
#
# Free-tier notes:
# - web service (free): cold-starts after ~15 min idle (first request ~1 min)
# - postgres (free): expires 30 days after creation (upgrade to keep data)
# - uploads (avatars) are stored on ephemeral disk: lost on redeploy/restart

services:
  - type: web
    name: v1-app
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: v1-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Push schema + seed test accounts (teacher/student) on every boot.
      # Both are idempotent, and "true" is the safe default.
      #
      # Setting this to "false" speeds up boots but means the schema is NEVER
      # pushed again: after any change to lib/db/src/schema you must run
      # `pnpm db:push` against the production DATABASE_URL yourself. Skip that
      # and every endpoint reading the changed table starts answering 500 —
      # drizzle lists all columns in its SELECTs, so Postgres replies
      # "column ... does not exist". That is exactly what took the whole "Слова"
      # section down (words.emoji, user_card_state.lapses,
      # flashcard_settings.daily_word_goal).
      #
      # The API server has a safety net for that case: on boot it adds missing
      # additive columns — see artifacts/api-server/src/lib/ensureSchema.ts. It
      # deliberately does NOT handle new tables, type changes or NOT NULL columns
      # without a default; those still need a real push.
      - key: RUN_DB_SETUP
        value: "true"
      # Optional integrations — add values in the Render dashboard if needed:
      # RESEND_API_KEY (email verification/reset), OPENAI_API_KEY (voice chat)

databases:
  - name: v1-db
    plan: free
    region: frankfurt
    databaseName: english_learning
    user: app
