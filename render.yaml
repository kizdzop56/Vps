# Render Blueprint: full app (API + web) + managed PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use: push this repo to GitHub, then in Render: New -> Blueprint ->
# select the repo -> Apply. Render creates both resources automatically.
#
# Free-tier notes:
# - web service (free): cold-starts after ~15 min idle (first request ~1 min)
# - postgres (free): expires 30 days after creation (upgrade to keep data)
# - uploads (avatars) are stored on ephemeral disk: lost on redeploy/restart

services:
  - type: web
    name: v1-app
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: v1-db
          property: connectionString
      # Подпись токенов. Значение генерирует Render один раз и держит его
      # неизменным. Без этой переменной сервер НЕ ЗАПУСТИТСЯ намеренно:
      # дефолтного секрета в коде больше нет (api-server/src/lib/auth.ts).
      - key: SESSION_SECRET
        generateValue: true
      # Код регистрации учителя. ЗАДАЁТСЯ ВРУЧНУЮ в дашборде Render
      # (Environment -> Add Environment Variable). Пока переменной нет,
      # регистрация учителей отвечает 503 — это нормальное состояние по
      # умолчанию: роль учителя видит персональные данные учеников.
      #
      # Раньше код был вписан в открытый исходник и в бандл фронтенда, то есть
      # учителем мог зарегистрироваться любой желающий.
      - key: TEACHER_CODE
        sync: false
      # Домены, которым разрешены браузерные запросы к API, через запятую.
      # Само приложение ходит на свой же origin, поэтому переменная нужна
      # только если API открывается для отдельного сайта.
      - key: ALLOWED_ORIGINS
        sync: false
      # Схему при старте приводит в порядок сам сервер (ensure-columns.mjs +
      # lib/ensureSchema.ts): досоздаются недостающие таблицы и колонки.
      #
      # RUN_DB_PUSH и RUN_SEED по умолчанию ВЫКЛЮЧЕНЫ. Раньше на их месте стоял
      # RUN_DB_SETUP=true, и `drizzle-kit push --force` уходил в живую базу на
      # каждом холодном старте — на бесплатном плане это десятки раз в сутки.
      # Включать RUN_DB_PUSH только осознанно и на один деплой:
      #   RUN_DB_PUSH  полный push схемы (ДЕСТРУКТИВНО)
      #   RUN_SEED     сид тестовых аккаунтов
      #
      # Optional integrations — add values in the Render dashboard if needed:
      #   RESEND_API_KEY     email verification / password reset
      #   GOOGLE_AI_API_KEY  AI tutor (chat + speech). Required for that section
      #   DEEPGRAM_API_KEY   word pronunciation + speech recognition fallback
      #   GOOGLE_TRANSLATE_API_KEY  flashcard translations

databases:
  - name: v1-db
    plan: free
    region: frankfurt
    databaseName: english_learning
    user: app
