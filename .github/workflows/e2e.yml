# E2E-прогоны по живому деплою.
#
# Две job:
#   smoke — быстрый обход: вход под всеми ролями, экраны открываются, API отвечает;
#   clickall — нажимает каждую кнопку на каждом экране и ищет мёртвые нажатия,
#              отказы сервера и пустые экраны. Долгий, поэтому отдельно.
#
# Когда запускается:
#   - каждый вечер в 18:00 по Минску (15:00 UTC);
#   - вручную: Actions → «E2E-прогон» → Run workflow (можно указать свой стенд
#     и отключить долгий прогон);
#   - при изменении самих тестов.
#
# Результат падения уходит в GitHub Issue с меткой e2e-failure — оттуда его
# читает QA-агент и раскладывает по тикетам.
name: E2E-прогон

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес стенда"
        required: false
        default: "https://v1-app-j975.onrender.com"
      click_all:
        description: "Нажимать каждую кнопку (долго, ~20 мин на роль)"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "0 15 * * *"
  push:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Обход экранов и API
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://v1-app-j975.onrender.com' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Свой npm-проект: папка e2e вне pnpm-воркспейса, зависимости приложения
      # не задеваются.
      - name: Установка Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      # continue-on-error: падение тестов — это ожидаемый исход прогона, отчёт
      # нужно собрать и опубликовать в любом случае. Статус job выставим в конце.
      - name: Прогон
        id: run
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test tests/api.spec.ts tests/ui.spec.ts

      - name: Отчёт
        if: always()
        working-directory: e2e
        run: node summarize.mjs report.json > summary.md && cat summary.md

      - name: Артефакты (скриншоты, видео, трейсы)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/report.json
            e2e/summary.md
          retention-days: 14
          if-no-files-found: ignore

      # Один открытый иссью на все падения: повторные прогоны добавляют
      # комментарий, а не плодят новые тикеты.
      - name: Отчёт о падениях в Issue
        if: always() && steps.run.outcome == 'failure'
        working-directory: e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create e2e-failure --color B60205 --description "Падения E2E-прогона" 2>/dev/null || true
          existing=$(gh issue list --label e2e-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file summary.md
          else
            gh issue create \
              --title "E2E: падения на стенде $(date -u '+%Y-%m-%d')" \
              --label e2e-failure \
              --body-file summary.md
          fi

      - name: Итог
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            echo "Обход нашёл падения — подробности в отчёте и в Issue с меткой e2e-failure"
            exit 1
          fi
          echo "Обход зелёный"

  clickall:
    name: Нажать каждую кнопку
    # Не зависит от smoke: даже если обход упал, кнопки проверить полезно.
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.click_all != 'false'
    timeout-minutes: 90
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://v1-app-j975.onrender.com' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Нажать каждую кнопку
        id: run
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test tests/clickAll.spec.ts

      - name: Отчёт
        if: always()
        working-directory: e2e
        run: node summarize.mjs report.json > summary.md && cat summary.md

      - name: Артефакты (скриншоты, видео, трейсы)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-clickall
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/report.json
            e2e/summary.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Отчёт о падениях в Issue
        if: always() && steps.run.outcome == 'failure'
        working-directory: e2e
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create e2e-failure --color B60205 --description "Падения E2E-прогона" 2>/dev/null || true
          # Помечаем источник: в одном иссью соседствуют отчёты обеих job.
          printf '### Прогон: нажатие всех кнопок\n\n' > clickall.md
          cat summary.md >> clickall.md
          existing=$(gh issue list --label e2e-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file clickall.md
          else
            gh issue create \
              --title "E2E: падения на стенде $(date -u '+%Y-%m-%d')" \
              --label e2e-failure \
              --body-file clickall.md
          fi

      - name: Итог
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            echo "Нашлись проблемные кнопки — подробности в отчёте и в Issue с меткой e2e-failure"
            exit 1
          fi
          echo "Все кнопки отвечают"
