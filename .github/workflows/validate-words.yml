# Проверка раздела «Слова»: датасет и логика.
#
# Два независимых job'а, потому что у них разная цена и разные триггеры.
#
# dataset — читает файлы как текст, без зависимостей и без tsc: прогон занимает
# секунды, поэтому pnpm install здесь не нужен. Срабатывает на изменения самого
# датасета.
#
# tests — модульные тесты сервера (интервальное повторение, оценки, очереди,
# подбор упражнений, проверка свободного ответа). Раньше их не запускало НИЧТО:
# файлы *.test.ts лежали в репозитории, но ни бегунка, ни скрипта не было, а
# workflow срабатывал только на scripts/src/data — то есть правка логики
# повторений не проверялась вообще ничем.
#
# validate-examples не роняет сборку из-за незаполненных примеров (это работа в
# процессе, а не поломка), но падает на реальных ошибках: ключ правки, которого
# нет в датасете, и один ключ в двух файлах уровней.
name: Проверка слов

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  dataset:
    name: Датасет
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Примеры употребления
        run: node scripts/validate-examples.mjs

      - name: Датасет карточек
        run: node scripts/validate-flashcards.mjs

  tests:
    name: Тесты сервера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --no-frozen-lockfile — как в Dockerfile: лок в репозитории разошёлся с
      # catalog из pnpm-workspace.yaml, и строгий режим падает на
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH ещё до установки.
      - name: Установка зависимостей
        run: pnpm install --no-frozen-lockfile

      - name: Модульные тесты
        run: pnpm --filter @workspace/api-server run test
